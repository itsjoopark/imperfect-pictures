<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperfect Pictures - Interactive Portrait</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="info-panel">
    <h1>Imperfect Pictures</h1>
    <div class="instructions">
      <p><strong>How to use:</strong></p>
      <ul>
        <li>Move your mouse to paint with image slices</li>
        <li>Press <kbd>W</kbd> to toggle between webcam and image</li>
        <li>Click anywhere to save your portrait</li>
      </ul>
    </div>
    <div class="controls">
      <!-- Uncomment to enable file upload -->
      <!-- <input type="file" id="upload-input" accept="image/*"> -->
    </div>
  </div>
  <script src="sketch.js"></script>
</body>
</html>
